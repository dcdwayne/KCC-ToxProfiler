# frontend/nginx.conf
'''
這份設定檔負責兩件事：
1.服務 Vue 打包後的靜態檔案，並加上 try_files $uri $uri/ /index.html; 解決 Vue Router 在 /review 或 /meta 重新整理時會 404 的問題。
2.將所有 /api/ 開頭的請求反向代理（Reverse Proxy）轉發給 FastAPI 容器 (http://backend:8000/api/)。
'''
server {
    listen 80;
    server_name _;

    # 1. 前端 Vue 3 靜態打包檔案
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # 關鍵：支援 Vue Router History 模式，重整頁面不報 404
        try_files $uri $uri/ /index.html;
    }

    # 2. 後端 FastAPI 反向代理
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 延長 Timeout 至 300 秒，避免未來有長耗時請求被 Nginx 提早切斷
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}