# docker-compose.ec2.yml (專供 AWS EC2 執行 FastAPI + Nginx 前端)
# 保留雙重相容：這裡除了讓 Nginx 監聽 80:80 並代理 /api/ 之外，我也幫你在 backend 保留了 8000:8000 映射，萬一你還沒改 .vue 裡的 :8000 也能直接通！

services:
  # 1. 後端 FastAPI 服務 (透過 Tailscale 連線回本地端 PostgreSQL)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tox-backend
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"

  # 2. 前端 Vue 3 + Nginx 反向代理服務
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tox-frontend-nginx
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend