version: '3.8'

services:
  # 1. PostgreSQL + pgvector 資料庫服務
  postgres:
    image: ankane/pgvector:latest
    container_name: tox-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # 2. pgAdmin 4 視覺化管理介面
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tox-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - postgres

  # 3. FastAPI 後端服務 (本地開發專用)
  backend:
    build: 
      context: ./backend  # 指向你的 backend 資料夾，Docker 會去這裡找 Dockerfile
    container_name: tox-backend-local
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app    # 【關鍵】將你本地的程式碼即時掛載到容器內的 /app 工作目錄
    env_file:
      - .env              # 讓 FastAPI 也能讀取到資料庫連線字串或 API Key
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload # 【關鍵】覆寫 Dockerfile 的 CMD，加上 --reload
    depends_on:
      - postgres
    environment:
      # 確保容器內的 FastAPI 知道資料庫的主機名稱是 postgres (對應上方的服務名稱)
      - DB_HOST=postgres 

volumes:
  pgdata:
  