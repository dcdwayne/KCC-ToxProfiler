version: '3.8'

services:
  # 1. PostgreSQL + pgvector 資料庫服務
  postgres:
    image: ankane/pgvector:latest
    container_name: tox-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # 2. pgAdmin 4 視覺化管理介面
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tox-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  pgdata:
